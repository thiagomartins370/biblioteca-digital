<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Infantil</title>

  <!-- Fonte infantil moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Cabeçalho super bonito -->
  <header class="header">
    <div class="header-left">
      <span class="logo">📚</span>
      <h1>Biblioteca Infantil</h1>
    </div>

    <div class="top-buttons">
      <a href="upload.html" class="btn-top add">➕ Cadastrar Livro</a>
      <a href="login.html" id="loginBtn" class="btn-top entrar">Entrar</a>
      <button id="logoutBtn" class="btn-top sair">Sair</button>
    </div>
  </header>

  <!-- Conteúdo -->
  <main class="main">

    <h2 class="titulo-lista">🌟 Explore os Livros Disponíveis </h2>

    <div class="search-box">
      <input id="busca" type="text" placeholder="Busque por título ou categoria..." />
      <button id="btn-buscar">🔍 Buscar</button>
    </div>

    <div id="lista" class="lista-livros"></div>

  </main>

  <!-- Rodapé -->
  <footer class="footer">
    Biblioteca Infantil © 2025 – Feito com ❤️ por Grupo PI 2
  </footer>

  <script src="app.js"></script>
</body>
</html>
