<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Livro – Biblioteca Infantil</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: linear-gradient(180deg, #d8f3ff, #e4ffe9);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      margin: 0;
      color: #333;
    }

    header {
      text-align: center;
      background: linear-gradient(90deg, #2ea8ff, #4bd4b0);
      color: #fff;
      padding: 16px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
    }

    main {
      max-width: 500px;
      margin: 40px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a85ff;
    }

    input, select {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #bcd9ff;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #f9fdff;
    }

    label {
      font-weight: bold;
      color: #1a85ff;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 18px;
      background-color: #2ea8ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #1a85ff;
    }

    #upload-status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }

    a {
      color: #1a85ff;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>📘 Cadastrar Novo Livro</h1>
  </header>

  <main>
    <form id="upload-form" enctype="multipart/form-data">
      <label for="title">📖 Título do Livro:</label>
      <input type="text" name="title" id="title" placeholder="Digite o título do livro" required>

      <label for="category">📚 Categoria:</label>
      <select name="category" id="category" required>
        <option value="">Selecione...</option>
        <option value="Aventuras">Aventuras</option>
        <option value="Folclore">Folclore</option>
        <option value="Aprendizado">Aprendizado</option>
        <option value="Para Dormir">Para Dormir</option>
        <option value="Outros">Outros</option>
      </select>

      <label for="cover">📸 Capa do Livro (imagem):</label>
      <input type="file" name="cover" id="cover" accept="image/*" required>

      <label for="pdf">📄 Arquivo PDF:</label>
      <input type="file" name="pdf" id="pdf" accept="application/pdf" required>

      <button type="submit">📤 Cadastrar Livro</button>
    </form>

    <p id="upload-status"></p>

    <p style="text-align:center; margin-top:20px;">
      <a href="index.html">⬅ Voltar à Biblioteca</a>
    </p>
  </main>

  <script src="upload.js"></script>
</body>
</html>
