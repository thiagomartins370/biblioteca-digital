<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>📌 Cadastrar Novo Livro</h1>
        <a class="btn-cadastro" href="index.html">← Voltar</a>
    </header>

    <main class="form-container">
        <form id="uploadForm">

            <label>Título do Livro</label>
            <input type="text" id="title" required>

            <label>Categoria</label>
            <input type="text" id="category" placeholder="Ex: Aventura, Folclore, Dormir..." required>

            <label>Capa (imagem)</label>
            <input type="file" id="cover" accept="image/*" required>

            <label>Arquivo PDF</label>
            <input type="file" id="pdf" accept="application/pdf" required>

            <button type="submit">Enviar Livro</button>
        </form>

        <p id="status-msg"></p>
    </main>

    <script src="upload.js"></script>
</body>
</html>
