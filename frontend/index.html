<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biblioteca Infantil</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>📘 Biblioteca Infantil</h1>
    <div class="menu-topo">
      <a class="btn-cadastro hidden" href="upload.html">+ Cadastrar Livro</a>
      <a class="btn-login" id="loginBtn" href="login.html">Entrar</a>
      <button id="logoutBtn" class="btn-sair hidden">Sair</button>
    </div>
  </header>

  <main>
    <h2>Explore os Livros Disponíveis</h2>

    <!-- Barra de busca -->
    <div class="topbar">
      <input id="busca" type="text" placeholder="Buscar por título ou categoria..." />
      <button id="btn-buscar">🔍 Buscar</button>
    </div>

    <!-- Lista de livros -->
    <ul id="lista" class="books-row"></ul>
  </main>

  <footer style="text-align:center; padding:15px; font-size:14px; color:#555;">
   <p>Desenvolvido pelo <strong>Grupo Biblioteca Digital Infantil</strong> – PI II Univesp 2025</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
